
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lenox Library Discovery</title>

<style>
:root{
  --ink:#241b2f;
  --muted:#62596d;
  --purple:#5b2b82;
  --pale:#f6f1f9;
  --line:#ddd4e4;
  --good:#285f48;
  --white:#fff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  background:#faf9fb;
  color:var(--ink);
  line-height:1.5;
}

button{
  font:inherit;
  cursor:pointer;
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:22px 18px 80px;
}

header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

.logo{font-size:38px}

h1{
  font-size:clamp(30px,7vw,48px);
  line-height:1.02;
  margin:.15em 0;
}

h2{
  font-size:28px;
  margin:.2em 0 .45em;
}

h3{
  margin:.15em 0;
  font-size:21px;
}

p{margin:.55em 0}

.sub{
  color:var(--muted);
  font-size:18px;
}

.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  margin:14px 0;
  box-shadow:0 3px 14px rgba(40,20,55,.05);
}

.notice{
  background:var(--pale);
  border-left:5px solid var(--purple);
}

.quest{
  background:#fbf8fd;
  border:2px solid #d8c8e4;
}

.location{
  font-weight:800;
  margin:12px 0;
  padding:10px 12px;
  background:#f5f4f6;
  border-radius:10px;
}

.btn{
  border:0;
  border-radius:12px;
  padding:13px 17px;
  background:var(--purple);
  color:#fff;
  font-weight:800;
  min-height:48px;
}

.btn.secondary{
  background:#fff;
  color:var(--purple);
  border:2px solid var(--purple);
}

.btn.ghost{
  background:#f1edf4;
  color:var(--ink);
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:16px;
}

.teamgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.team{
  background:#fff;
  color:var(--ink);
  border:2px solid var(--line);
}

.progress{
  height:12px;
  background:#e9e4ed;
  border-radius:99px;
  overflow:hidden;
  margin:10px 0 4px;
}

.progress>div{
  height:100%;
  background:var(--purple);
  transition:width .2s;
}

.missions{
  display:grid;
  gap:10px;
  margin-top:18px;
}

.mission{
  width:100%;
  text-align:left;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:15px;
  display:grid;
  grid-template-columns:42px 1fr auto;
  gap:10px;
  align-items:center;
  color:var(--ink);
}

.mission .icon{font-size:27px}

.mission .meta{
  font-size:14px;
  color:var(--muted);
  margin-top:3px;
}

.mission.done{
  border-color:#9db8aa;
  background:#f7fbf9;
}

.check{
  font-weight:900;
  color:var(--good);
}

.step{
  margin:8px 0;
  padding-left:4px;
}

.back{
  background:none;
  border:0;
  color:var(--purple);
  font-weight:800;
  padding:8px 0;
  margin-bottom:8px;
}

.small{
  font-size:14px;
  color:var(--muted);
}

.complete{
  text-align:center;
  padding:28px 18px;
}

.hidden{display:none!important}

.footer-note{
  margin-top:25px;
  font-size:14px;
  color:var(--muted);
  text-align:center;
}


/* ACCESSIBILITY CONTROLS */

.a11ybar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 16px;
}

.a11ybtn{
  border:2px solid var(--purple);
  border-radius:999px;
  padding:9px 12px;
  background:#fff;
  color:var(--purple);
  font-weight:800;
  min-height:44px;
}

.a11ybtn[aria-pressed="true"]{
  background:var(--purple);
  color:#fff;
}


/* SENSORY-FRIENDLY MODE */

body.sensory{
  background:#fff;
  color:#111;
}

body.sensory .wrap{
  max-width:720px;
}

body.sensory .decorative{
  display:none;
}

body.sensory .card{
  background:#fff;
  border:1px solid #777;
  border-radius:4px;
  box-shadow:none;
  padding:18px;
}

body.sensory .notice,
body.sensory .quest{
  background:#fff;
  border:1px solid #777;
  border-left:3px solid #333;
}

body.sensory .location{
  background:#fff;
  border:1px solid #999;
  border-radius:3px;
}

body.sensory .mission{
  background:#fff;
  border:1px solid #777;
  border-radius:4px;
  box-shadow:none;
  grid-template-columns:1fr auto;
}

body.sensory .mission .icon{
  display:none;
}

body.sensory .mission.done{
  background:#fff;
  border:2px solid #333;
}

body.sensory .btn{
  background:#fff;
  color:#111;
  border:2px solid #333;
  border-radius:4px;
}

body.sensory .btn.secondary,
body.sensory .btn.ghost{
  background:#fff;
  color:#111;
  border:1px solid #555;
}

body.sensory .team{
  background:#fff;
  color:#111;
  border:1px solid #555;
}

body.sensory .back{
  color:#111;
  text-decoration:underline;
}

body.sensory .a11ybtn{
  background:#fff;
  color:#111;
  border:1px solid #555;
  border-radius:4px;
}

body.sensory .a11ybtn[aria-pressed="true"]{
  background:#222;
  color:#fff;
}

body.sensory .progress{
  height:8px;
  background:#ddd;
  border-radius:0;
}

body.sensory .progress>div{
  background:#333;
}

body.sensory .sub,
body.sensory .small,
body.sensory .mission .meta,
body.sensory .footer-note{
  color:#444;
}

body.sensory h1{font-size:34px}
body.sensory h2{font-size:25px}
body.sensory h3{font-size:19px}

body.sensory *,
body.sensory *::before,
body.sensory *::after{
  animation:none!important;
  transition:none!important;
}


/* MOBILE */

@media(max-width:520px){

  .teamgrid{
    grid-template-columns:1fr;
  }

  .mission{
    grid-template-columns:38px 1fr auto;
  }

  .wrap{
    padding:16px 14px 70px;
  }

  body.sensory .mission{
    grid-template-columns:1fr auto;
  }
}


/* DEVICE REDUCED MOTION */

@media(prefers-reduced-motion:reduce){

  *{
    scroll-behavior:auto!important;
    transition:none!important;
    animation:none!important;
  }

}
</style>
</head>

<body>

/* SAVE */

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(state)
  );

}


function esc(s){

  return String(s||"").replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );

}


/* ACCESSIBILITY BAR */

function accessibilityBar(){

  const sensory=
  document.body.classList.contains("sensory");

  let readLabel="🔊 Read aloud";

  if(reading && speechPaused){

    readLabel="▶ Resume";

  }

  else if(reading){

    readLabel="⏸ Pause";

  }

  return `

  <div
  class="a11ybar"
  aria-label="Accessibility options">

  <button
  class="a11ybtn"
  id="readBtn"
  type="button"
  aria-pressed="${reading}"
  onclick="toggleReadAloud()">

  ${readLabel}

  </button>


  <button
  class="a11ybtn"
  id="sensoryBtn"
  type="button"
  aria-pressed="${sensory}"
  onclick="toggleSensory()">

  ${sensory
    ? "Sensory-friendly: ON"
    : "🌿 Sensory-friendly"}

  </button>

  </div>

  `;

}


/* READ ALOUD */

function getReadableText(){

  const app=
  document.getElementById("app");

  if(!app) return "";

  const clone=
  app.cloneNode(true);


  /*
  Skip controls, footer notes, hidden content,
  and anything specifically marked speech-skip.
  */

  clone.querySelectorAll(
    ".a11ybar, button, .footer-note, .hidden, .speech-skip"
  ).forEach(el=>el.remove());


  let text=clone.innerText;


  /*
  Remove emojis and decorative symbols
  from speech only.
  */

  text=text
    .replace(/\p{Extended_Pictographic}/gu," ")
    .replace(/[\uFE0F\u200D]/g," ")
    .replace(/[•→✓›]/g," ")
    .replace(/\s+/g," ")
    .trim();


  text=text
    .replace(/\b2 A\.M\.\b/gi,"2 A M")
    .replace(/\bUWW\b/g,"U W W");


  return text;

}


function chooseVoice(){

  const voices=
  window.speechSynthesis.getVoices();

  if(!voices.length){
    return null;
  }


  const preferredNames=[

    "Microsoft Aria Online",
    "Microsoft Jenny Online",
    "Microsoft Aria",
    "Microsoft Jenny",
    "Samantha",
    "Google US English"

  ];


  for(const name of preferredNames){

    const voice=
    voices.find(v=>
      v.name
      .toLowerCase()
      .includes(name.toLowerCase())
    );

    if(voice){
      return voice;
    }

  }


  return (

    voices.find(v=>
      v.lang==="en-US" &&
      v.default
    )

    ||

    voices.find(v=>
      v.lang==="en-US"
    )

    ||

    voices.find(v=>
      v.lang &&
      v.lang.startsWith("en")
    )

    ||

    null

  );

}


function updateReadButton(){

  const button=
  document.getElementById("readBtn");

  if(!button) return;


  if(reading && speechPaused){

    button.textContent="▶ Resume";

  }

  else if(reading){

    button.textContent="⏸ Pause";

  }

  else{

    button.textContent="🔊 Read aloud";

  }


  button.setAttribute(
    "aria-pressed",
    reading ? "true" : "false"
  );

}


function stopReading(){

  if("speechSynthesis" in window){

    window.speechSynthesis.cancel();

  }

  reading=false;
  speechPaused=false;

  updateReadButton();

}


function toggleReadAloud(){

  if(!("speechSynthesis" in window)){

    alert(
      "Read aloud is not supported in this browser."
    );

    return;

  }


  /* PAUSE */

  if(reading && !speechPaused){

    window.speechSynthesis.pause();

    speechPaused=true;

    updateReadButton();

    return;

  }


  /* RESUME */

  if(reading && speechPaused){

    window.speechSynthesis.resume();

    speechPaused=false;

    updateReadButton();

    return;

  }


  /* START */

  const text=
  getReadableText();

  if(!text) return;


  window.speechSynthesis.cancel();


  const speech=
  new SpeechSynthesisUtterance(text);


  const voice=
  chooseVoice();


  if(voice){

    speech.voice=voice;

    speech.lang=
    voice.lang || "en-US";

  }

  else{

    speech.lang="en-US";

  }


  speech.rate=.94;
  speech.pitch=1;
  speech.volume=1;


  speech.onend=()=>{

    reading=false;
    speechPaused=false;

    updateReadButton();

  };


  speech.onerror=()=>{

    reading=false;
    speechPaused=false;

    updateReadButton();

  };


  reading=true;
  speechPaused=false;

  updateReadButton();

  window.speechSynthesis.speak(speech);

}


if("speechSynthesis" in window){

  window.speechSynthesis.getVoices();

  window.speechSynthesis.onvoiceschanged=()=>{

    window.speechSynthesis.getVoices();

  };

}


/* SENSORY-FRIENDLY MODE */

function toggleSensory(){

  const on=
  !document.body.classList.contains(
    "sensory"
  );


  /*
  Sensory mode is visual only.
  Do not stop, restart, or re-render speech.
  */

  document.body.classList.toggle(
    "sensory",
    on
  );


  localStorage.setItem(
    SENSORY_KEY,
    on ? "true" : "false"
  );


  const sensoryButton=
  document.getElementById("sensoryBtn");


  if(sensoryButton){

    sensoryButton.setAttribute(
      "aria-pressed",
      on ? "true" : "false"
    );


    sensoryButton.textContent=
      on
      ? "Sensory-friendly: ON"
      : "🌿 Sensory-friendly";

  }

}


function applySavedSensory(){

  const on=
  localStorage.getItem(
    SENSORY_KEY
  )==="true";


  document.body.classList.toggle(
    "sensory",
    on
  );

}

else if(state.screen==="dashboard"){

const n=

app.innerHTML=
accessibilityBar()+`

<header class="speech-skip">

🐙
</div>

<div>

<strong>
${esc(state.team)} Team
</strong>

Lenox Library Discovery
</div>

</h2>

Choose what to do next.

<div class="card notice">

<p>
Your Quest Card is where your answers go.
</p>

</div>


<div
class="progress"
aria-label="${n} of ${missions.length} complete">

<div
style="width:${n/missions.length*100}%">
</div>

</div>


<div class="small">

<strong>
${n} of ${missions.length}
</strong>

complete

</div>


<div class="missions">

${missions.map(m=>`

<button
class="mission ${state.done[m.id]?"done":""}"
onclick="openMission('${m.id}')">

<span class="icon">
${m.icon}
</span>

<span>

<strong>
${m.title}
</strong>

<div class="meta">
${m.place}
</div>

</span>

<span class="check">

${state.done[m.id]
? "✓"
: "›"}

</span>

</button>

`).join("")}

</div>


${n===missions.length ? `

<div class="card complete">

<div
class="decorative"
style="font-size:52px">
🐙
</div>

<h2>
You know your way around Lenox.
</h2>

<p>
You found services, research tools,
books, articles, databases,
and people who can help.
</p>

<p>
<strong>
You don't need to remember everything.
You need to know where to come back
when you need it.
</strong>
</p>


<div class="card notice">

<strong>
📝 Before you finish.
</strong>

<p>
Make sure you recorded all eight discoveries
on your <strong>Quest Card</strong>.
</p>

<p>
Bring your card with you
and show Camille this screen.
</p>

</div>


<button
class="btn"
onclick="
stopReading();
state.screen='finish';
save();
render();
">

SHOW CAMILLE

</button>

</div>

` : ""}


<div class="footer-note">

No timer. No penalties.
Ask for help whenever you need it.

</div>

`;

}


/* MISSION */

else if(
state.screen.startsWith("m:")
){

const id=
state.screen.slice(2);

const m=
missions.find(x=>x.id===id);


app.innerHTML=
accessibilityBar()+`

<button
class="back"
onclick="
stopReading();
state.screen='dashboard';
save();
render();
">

← All discoveries

</button>


<div class="card">

<div
class="decorative"
style="font-size:42px">

${m.icon}

</div>


<h2>
${m.title}
</h2>

<p class="sub">
${m.intro}
</p>


${m.body}


<div class="actions">

<button
class="btn"
onclick="
completeMission('${id}')
">

${state.done[id]
? "DONE ✓"
: "I WROTE IT DOWN"}

</button>


<button
class="btn ghost"
onclick="
stopReading();
state.screen='dashboard';
save();
render();
">

Do this later

</button>

</div>

</div>

`;

}


/* FINISH */

else if(
state.screen==="finish"
){

const locations={

"🟣 Purple":
"Under the globe in the first-floor reference collection.",

"🟢 Green":
"Right of the big screen featuring Banned Books Roulette, behind the snake plant.",

"🔴 Red":
"Behind the Freshman Year display on the first floor.",

"🟡 Yellow":
"Near the color printer, left of the paper stacks."

};


app.innerHTML=
accessibilityBar()+`

<div class="card complete">

<div
class="decorative"
style="font-size:58px">
🐙
</div>

<h1>
All done.
</h1>

<p class="sub">
Show this screen to Camille.
</p>


<div class="card notice">

<strong>
📝 Bring your Quest Card.
</strong>

<p>
Camille will check your completed Quest Card
before your team's octopus location is revealed.
</p>

</div>


<button
class="btn"
onclick="
stopReading();
document
.getElementById('reveal')
.classList.remove('hidden');
">

CAMILLE: REVEAL OCTOPUS

</button>


<div
id="reveal"
class="card notice hidden">

<h3>
${esc(state.team)} Team.
</h3>

<p>
<strong>

${esc(
locations[state.team]
||
"Ask Camille for your team's location."
)}

</strong>
</p>

<p>
Bring your octopus back to base.
</p>

</div>


<div class="actions">

<button
class="btn secondary"
onclick="
stopReading();
state.screen='dashboard';
save();
render();
">

Back to discoveries

</button>


<button
class="btn ghost"
onclick="
stopReading();
restart();
">

Restart

</button>

</div>

</div>

`;

}

}


/* NAVIGATION */

function openMission(id){

  stopReading();

  state.screen="m:"+id;

  save();

  render();

}


function completeMission(id){

  stopReading();

  state.done[id]=true;

  save();

  state.screen="dashboard";

  save();

  render();

}


function restart(){

  if(
    confirm(
      "Restart this scavenger hunt and clear progress on this device?"
    )
  ){

    state=fresh();

    save();

    render();

  }

}


/* START APP */

applySavedSensory();

render();

</script>

</body>
</html>
